[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-predictor"
version = "2.0.0"
description = "Probabilistic NBA player projections: next game stat distributions, fantasy points and prop pricing."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rohan Shah" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "nba_api>=1.10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "cachetools>=5.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
mlops = ["mlflow>=2.12"]
deploy = ["huggingface_hub>=0.24"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-cachetools",
]

[project.scripts]
nba-predictor = "nba_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PD002", "NPY"]
ignore = ["N803", "N806", "RUF012"]

[tool.mypy]
python_version = "3.11"
packages = ["nba_predictor"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
